<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>

        th{
            border:3px solid mediumspringgreen;
        }
        #hyperlinkbutton{
            color: cyan;
            border-style:dashed;
            border-color:cyan;
            font-size:20px;

        }
        .container{
            padding:20px;
            border: 3px solid mediumspringgreen;
            font-size:10px;
            horiz-align: center;
            vertical-align: central;

        }
    </style>
</head>
<body>




        <table class="table table-striped table-dark" >
            <thead class="thead-dark">
            <tr>
                <th>Name</th>
                <th >Genre</th>
                <th>Release Date</th>
                <th>Price</th>
                <th>Edit/delete</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="v:${videogames}">
                <td th:text="${v.getvName()}"></td>
                <td th:text="${v.getvGenre()}"></td>
                <td th:text="${v.getvReleaseDate()}"></td>
                <td th:text="${v.getvPrice()}"></td>
                <td> <button th:href="@{videogames/edit(id=${v.vId})}" class="btn btn-outline-success">Edit</button> <button class="btn btn-outline-success">Delete</button></td>
            </tr>
            </tbody>
        </table>


    <div class="container text-center" >

        <a class="btn link-underline-opacity-0-hover" id="hyperlinkbutton" th:href="@{/videogames/add}">Add a new videogame</a>
    </div>

</body>
</html>

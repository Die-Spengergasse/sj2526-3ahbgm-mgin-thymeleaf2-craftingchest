<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
 <div class="card">
    <div class="card-header">
        <ul class="nav nav-tabs card-header-tabs" id="myTab" role="tablist"></ul>

        <h1 class="text text-center text-success "> Edit Videogame</h1>
    </div>
     <div  class="card-body">
         <table class="table table-striped table-dark" >
             <thead class="thead-dark">
             <tr>
                 <th> Current Name</th>
                 <th > Current Genre</th>
                 <th> Current Release Date</th>
                 <th> Current Price</th>
             </tr>
             </thead>
             <tbody>
             <tr>
                 <td th:text="*{videogames.Vname}"></td>
                 <td th:text="${vGenre()}"></td>
                 <td th:text="${vReleaseDate()}"></td>
                 <td th:text="${vPrice()}"></td>

             </tr>
             </tbody>

         </table>
     </div>
 </div>
</body>
</html>
